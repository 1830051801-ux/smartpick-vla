[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "smartpick-vla"
version = "0.1.0"
description = "Language-conditioned manipulation with compact action-chunk VLA policies, bounded residual RL, and Real2Sim2Real tooling."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "SmartPick-VLA contributors" }]
keywords = ["robotics", "mujoco", "vision-language-action", "reinforcement-learning", "sim2real"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "gymnasium>=1.1,<2",
  "imageio>=2.37,<3",
  "imageio-ffmpeg>=0.6,<1",
  "matplotlib>=3.10,<4",
  "mujoco>=3.3,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "pillow>=11,<13",
  "pyyaml>=6.0,<7",
  "torch>=2.7,<3",
  "tqdm>=4.67,<5",
]

[project.urls]
Homepage = "https://github.com/1830051801-ux/smartpick-vla"
Documentation = "https://github.com/1830051801-ux/smartpick-vla/tree/main/docs"
Issues = "https://github.com/1830051801-ux/smartpick-vla/issues"
Source = "https://github.com/1830051801-ux/smartpick-vla"

[project.optional-dependencies]
dev = [
  "bandit>=1.9,<2",
  "build>=1.2,<2",
  "mypy>=1.15,<3",
  "pip-audit>=2.10,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "pandas-stubs>=2.2,<4",
  "types-PyYAML>=6.0,<7",
]
ros2 = []

[project.scripts]
smartpick = "smartpick_vla.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smartpick_vla"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "smartpick_vla/configs"

[tool.hatch.build.targets.sdist]
include = [
  ".github",
  "src",
  "checkpoints/smoke",
  "configs",
  "docs",
  "examples",
  "results/smoke",
  "ros2_ws",
  "scripts",
  "tests",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "CITATION.cff",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "THIRD_PARTY_NOTICES.md",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "mujoco: requires MuJoCo physics",
  "slow: longer-running integration test",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["results", "checkpoints", "datasets/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "mujoco"
ignore_missing_imports = true
