name: Release candidate

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MUJOCO_GL: egl
      PYTHONHASHSEED: "0"
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linux rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libglfw3 libosmesa6

      - name: Install build and verification tools
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.7,<3"
          python -m pip install -e ".[dev]" twine

      - name: Validate repository for a tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check_release.py --strict --tag "${GITHUB_REF_NAME}"

      - name: Validate repository for a manual candidate
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/check_release.py --strict

      - name: Run fast tests
        run: python -m pytest -m "not slow"

      - name: Run Ruff checks
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Run Mypy
        run: python -m mypy src/smartpick_vla

      - name: Run security checks
        run: |
          python -m bandit -r src scripts ros2_ws -q -ll -ii
          python -m pip_audit --local --skip-editable

      - name: Build source and wheel distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test the wheel in a clean environment
        shell: bash
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install --upgrade pip "setuptools>=83"
          wheel-test/bin/python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.7,<3"
          wheel-test/bin/python -m pip install dist/*.whl
          wheel-test/bin/smartpick --help

      - name: Generate distribution checksums
        shell: bash
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS.txt

      - name: Upload verified distributions
        uses: actions/upload-artifact@v7
        with:
          name: smartpick-vla-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: smartpick-vla-distributions
          path: dist

      - name: Create or update draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "Refusing to replace assets on an already published release: $TAG" >&2
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --verify-tag --generate-notes --title "$TAG"
          fi
